<style>

ize:26px}.s2{top:29%;right:15%;font-size:18px;animation-delay:1s}.s3{bottom:20%;left:23%;font-size:15px;animation-delay:2s}.s4{bottom:24%;right:22%;font-size:25px;animation-delay:.5s}.dot{position:absolute;width:5px;height:5px;background:#ffeab1;border-radius:50%;box-shadow:0 0 12px 4px #ffd56877;animation:float 4s ease-in-out infinite}.d1{top:23%;left:32%}.d2{top:67%;right:31%;animation-delay:1.5s}.d3{top:42%;right:10%;animation-delay:.7s}.firework{position:absolute;z-index:0;color:#ffe7a4;font-size:clamp(48px,7vw,86px);line-height:1;filter:drop-shadow(0 0 16px #ffd25c);opacity:0;animation:burst 4.8s ease-out infinite;pointer-events:none}.f1{top:19%;left:18%}.f2{top:23%;right:19%;animation-delay:1.6s}.f3{bottom:17%;left:31%;font-size:clamp(36px,5vw,62px);animation-delay:3.1s}.spark{position:absolute;z-index:0;color:#fff0b6;font-size:clamp(14px,2vw,24px);text-shadow:0 0 12px #ffd45c;animation:twinkle 2.6s ease-in-out infinite;pointer-events:none}.p1{top:12%;left:43%}.p2{top:38%;left:8%;animation-delay:.6s}.p3{top:68%;left:16%;animation-delay:1.1s}.p4{top:57%;right:12%;animation-delay:1.8s}.p5{bottom:12%;right:39%;animation-delay:.9s}.p6{top:16%;right:35%;animation-delay:1.4s}.horizon{position:absolute;bottom:-1px;left:0;width:100%;height:20%;opacity:.23;background:linear-gradient(transparent,#300610);clip-path:polygon(0 62%,8% 62%,8% 38%,12% 38%,12% 67%,19% 67%,19% 26%,23% 26%,23% 58%,31% 58%,31% 44%,37% 44%,37% 69%,46% 69%,46% 33%,50% 33%,50% 62%,58% 62%,58% 46%,65% 46%,65% 72%,73% 72%,73% 28%,77% 28%,77% 61%,87% 61%,87% 40%,92% 40%,92% 65%,100% 65%,100% 100%,0 100%)}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes sweep{0%,15%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes glow{50%{text-shadow:0 3px 0 #a53b19,0 8px 38px #ffd36a88}}@keyframes float{0%,100%{transform:translateY(0) rotate(0);opacity:.65}50%{transform:translateY(-13px) rotate(15deg);opacity:1}}@keyframes burst{0%,100%{transform:scale(.35) rotate(-12deg);opacity:0}14%{opacity:.8}48%{transform:scale(1.18) rotate(18deg);opacity:.36}70%{opacity:0}}@keyframes twinkle{0%,100%{transform:scale(.45) rotate(0);opacity:.25}50%{transform:scale(1.2) rotate(45deg);opacity:1}}@media(max-width:600px){body{padding:0}.banner{height:clamp(280px,42vh,360px);min-height:280px;aspect-ratio:unset;border-radius:0}.content{padding:22px 19px;padding-top:clamp(32px,7vh,58px)}.tag{font-size:15px;padding:7px 13px}.title{font-size:clamp(30px,7.4vw,43px);letter-spacing:.02em}.subtitle{font-size:13px;letter-spacing:.1em}.s1{left:8%}.s2{right:8%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
